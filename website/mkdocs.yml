site_name: milk
site_description: "Switch models, not context."
site_url: https://milkai.dev
repo_url: https://github.com/scoutme/milk
repo_name: scoutme/milk
edit_uri: edit/main/docs/

docs_dir: ../docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  logo: assets/milk-xs.png
  favicon: assets/milk-xxs.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Documentation:
      - start/index.md
      - Install & first run: start/getting-started.md
  - Guides:
      - guides/index.md
      - Providers & configuration: guides/providers.md
      - Routing, sessions & workflows: guides/workflows.md
      - Tooling, MCP & tool-agents: guides/tooling.md
      - Day-to-day operations: guides/operations.md
  - Reference:
      - reference/index.md
      - Evaluation (milk eval): reference/eval.md
      - ACP integration: reference/acp-integration.md
      - Specification & CLI reference: reference/spec.md
  - Decisions: adr/README.md

plugins:
  - search
  - redirects:
      redirect_maps:
        # pre-IA-restructure URLs (ADR-0054) — keep old links working
        getting-started.md: start/getting-started.md
        providers.md: guides/providers.md
        workflows.md: guides/workflows.md
        tooling.md: guides/tooling.md
        operations.md: guides/operations.md
        eval.md: reference/eval.md
        acp-integration.md: reference/acp-integration.md
        spec.md: reference/spec.md

# Only docs/ outside docs/internal/ is published. The boundary is the
# directory (ADR-0054), not a per-file denylist: internal design notes, plans,
# and analyses live under docs/internal/ and are excluded wholesale here.
exclude_docs: |
  internal/
  embed.go

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
