# team — like swarm, but for LOOSELY COUPLED work: a shared board is the
# single source of truth all roles read ({{.board}} / board_get) and write
# (board_claim / board_update / board_post) during the run, and a
# coordinator reconciles it between passes. swarm maximizes parallelism on
# independent items; team keeps parallel work on coupled items coherent —
# claims structurally prevent duplicate work, findings unblock teammates
# mid-flight, and the stand-up re-queues blocked items with new context.
#
# Coordination model (ADR-0071, issue #197):
#   - board claims are CAS (first claimer wins) — a worker whose claim comes
#     back held by a teammate or done stops immediately (one cheap turn)
#   - {{.board}} snapshots every stage's prompt at stage start; board_get
#     reads the live picture mid-turn (local-provider roles; CLI roles get
#     the snapshot only — see the worker prompt's fallback line)
#   - the coordinator stand-up runs between passes: reconciles, posts
#     announcements, and decides all_done / more_work
#
# board: true + the board_seed stage are generic engine capabilities —
# nothing in the interpreter is specific to this workflow's name; any
# custom definition (~/.milk/workflows/*.yaml) can use them the same way.

vars:
  plan_instructions: |
    ## Spec
    A precise description of what needs to be built, including acceptance criteria.

    ## Item Plan
    Break the work into independent units of work. Use one section per item, each headed
    exactly as "## Item N" (e.g. "## Item 1"). If an item can only be done after another
    item finishes (e.g. it needs files that item creates), declare that with
    "## Item N (depends_on: M)" or "## Item N (depends_on: M, K)" for multiple dependencies.
    Items with no depends_on run concurrently with each other; a dependent item only starts
    once everything it depends on has finished.

    These items are posted to a shared board and claimed by workers as they start — keep
    each item's scope explicit and independently finishable so a claimer never needs
    another item's in-flight context. Note discoveries other items must know (changed
    signatures, shared helpers) as short notes: teammates read them.

    For each item, describe the concrete deliverable and its acceptance criteria in enough
    detail that a worker can implement it without further clarification, and an evaluator can
    check it in isolation from the other items. State the exact file path(s) the deliverable
    must produce -- an evaluator will check for their literal existence, not just a description
    of intent.

    Keep the number of items to the minimum needed -- do not split work into more items than
    there are genuinely independent (or dependency-ordered) units of work.

name: team
board: true
roles: [designer, worker, evaluator, coordinator, implementer]

stages:
  - id: designer
    kind: agent_turn
    role: designer
    save_as: plan
    skip_user_checkpoint_marker: "NO_QUESTIONS"
    prompt: |
      You are the designer for this development task.

      Task: {{.task}}

      Before producing a full plan, identify any ambiguities or missing information that would
      affect the design, and in particular how the work should be split into independent items.

      If the task has ambiguities worth asking about, respond with ONLY the questions, structured as:

      ## Questions
      - Q1: <question>
      - Q2: <question>
      ...

      ## Defaults
      If the user doesn't answer, use these defaults:
      - Q1: <default answer>
      - Q2: <default answer>
      ...

      Keep the number of questions to the minimum needed. Prefer reasonable defaults over asking.

      Otherwise -- if the task is already clear enough to design without asking -- skip the
      questions entirely. Respond with "NO_QUESTIONS" on its own line, immediately followed by
      the full spec and item plan in this format:

      {{.plan_instructions}}
    on_answer_prompt: |
      You are the designer for this development task.

      Task: {{.task}}

      You previously identified these ambiguities:
      {{.designer_questions}}

      The user provided these answers:
      {{.designer_answer}}

      Now produce the full detailed spec and item plan incorporating the user's choices.

      {{.plan_instructions}}

  - id: board_init
    kind: board_seed
    over: Item
    from: plan

  - id: team_pass_loop
    kind: loop
    max_iterations: 3
    iteration_var: pass
    body:
      - id: worker_fanout
        kind: parallel_group
        over: Item
        from: plan
        max_concurrency: 4
        save_as: worker_results
        body:
          - id: worker_pass_loop
            kind: loop
            max_iterations: 3
            iteration_var: pass
            body:
              - id: worker
                kind: agent_turn
                role: worker
                save_as: worker_output
                empty_output_fallback: git_diff
                prompt: |
                  You are a worker on a team run. Your item comes from a shared board that
                  teammates work on concurrently.

                  FIRST action: board_claim item {{.item}}.
                  - If the claim says NOT claimed (a teammate holds it, or it is done): STOP.
                    Reply with exactly one line -- "SKIPPED: <why>" -- and do no other work.
                    Do not "help" the holder; do not touch files for that item.
                  - If the claim succeeds (or confirms your own existing claim): proceed.

                  ## Item
                  {{.item_section}}

                  Shared team board (snapshot at this turn's start — use board_get when you
                  need the live picture; findings marked for your item matter):
                  {{.board}}

                  {{if and (gt .pass 1) .worker_findings}}## Evaluator findings from previous pass
                  {{.worker_findings}}

                  {{end -}} Implement this item's deliverables as described above.
                  While you work: board_update item {{.item}} status=in_progress once you start;
                  the moment you discover something other items must know (a changed signature,
                  a shared helper, a file already covered elsewhere), board_post it — that is how
                  teammates avoid duplicating you. If you get stuck behind a missing dependency,
                  board_update status=blocked with the reason in notes instead of looping.

                  Use your tools (read_file, write_file, edit_file, bash, etc.) to read, create, and
                  modify files. Before ending your turn, verify with a tool call that every file
                  you claim to have created or modified actually exists with the real content — a
                  tool call not erroring doesn't mean it worked. If an expected input file from a
                  dependency is missing, check the obvious location once and stop searching; note
                  the missing dependency and proceed with what you can.

                  Finish with board_update item {{.item}} status=done and a short summary in
                  notes, then write a plain-text summary of what you did: which files were created
                  or modified, what each change does, and which acceptance criteria it satisfies.
                  If you couldn't complete part of the deliverable — including because a
                  dependency's output was missing — say so plainly; don't imply success for work
                  you didn't finish. This written summary is mandatory — the evaluator reads it.
                  (If you are a CLI role without board_* tools: treat the board snapshot as
                  read-only, follow the same claim discipline in your summary's first line —
                  "CLAIM <n>" or "SKIPPED: <why>" — and do the status reporting verbally.)

              - id: worker_eval
                kind: agent_turn
                role: evaluator
                save_as: worker_findings
                prompt: |
                  You are the evaluator. Review Item {{.item}} (pass {{.pass}}).

                  ## Item
                  {{.item_section}}

                  Shared team board (context — what teammates did/found):
                  {{.board}}

                  {{if .worker_output}}## Worker output
                  {{.worker_output}}

                  {{else}}## Worker output
                  (empty -- the worker produced no written summary)

                  NOTE: The worker may have used tools to modify files directly without producing a
                  written summary. Use your read_file and bash tools to inspect the codebase and
                  determine whether the item's deliverables were actually implemented.

                  {{end -}}
                  Review the item's deliverables against its acceptance criteria.
                  Do not take the worker's summary at face value — use your tools (read_file, bash,
                  etc.) to confirm the claimed deliverable file(s) actually exist and contain
                  what's claimed. If an expected file is missing, check the obvious location once
                  and stop searching rather than combing the whole filesystem. If the worker's
                  output is a SKIPPED line, do not assess the item — report that the claim moved.

                  Write a findings section describing what is correct and what needs improvement.

                  End your response with exactly ONE of these verdict lines:
                  - good_to_go
                  - needs_refinement

                  Use "good_to_go" when all acceptance criteria are met, or this is the final pass and
                  remaining issues are minor or impractical to resolve in one more iteration.
                  Use "needs_refinement" only when there are fixable issues AND passes remain.

                  IMPORTANT: if this is the final pass (pass {{.pass}} = 3), do NOT return
                  "needs_refinement" — use "good_to_go" instead, since no further refinement will
                  occur. This only controls whether the workflow retries, not whether the work is
                  actually complete — if a required deliverable is still missing or substantially
                  incomplete on this final pass, say so as the first line of your findings (e.g.
                  "INCOMPLETE: <what's missing>"). Other items may depend on this one and will read
                  your findings; a false "done" here sends them chasing a file that was never
                  written.
                verdict:
                  good_to_go: {action: break}
                  needs_refinement: {action: retry}
                  unknown: {action: retry, warn: true}

      - id: standup
        kind: agent_turn
        role: coordinator
        save_as: standup_report
        prompt: |
          You are the coordinator. The pass's fan-out just finished — reconcile the shared
          board before deciding whether another pass is needed.

          ## Board (live)
          {{.board}}

          ## Per-item results this pass
          {{range .worker_results}}## Item {{.Index}} -- {{.Status}}
          {{.Output}}

          {{end -}}
          Using your tools: cross-check the board against reality (an item marked done whose
          output is missing, a blocker nobody picked up, two items that duplicated work),
          post your announcements and guidance with board_post so the NEXT pass's workers see
          them, and fix statuses with board_update where reality differs (e.g. stuck
          in_progress items back to todo so they can be re-claimed).

          Then end your response with exactly ONE of these verdict lines:
          - all_done
          - more_work

          Use "all_done" when every item is done (or was deliberately, acceptably skipped) and
          no further changes are needed. Use "more_work" when items remain blocked, failed, or
          need another refinement pass. On the FINAL pass (pass {{.pass}} = 3) you MUST answer
          "all_done" — the loop cannot continue — so state any unfinished work plainly in the
          body above instead; a false "all_done" here just stops the run where it is.
        verdict:
          all_done: {action: break}
          more_work: {action: retry}
          unknown: {action: retry, warn: true}

  - id: final_evaluation
    kind: agent_turn
    role: evaluator
    save_as: final_findings
    prompt: |
      You are the final evaluator. Every item was implemented on the shared board — claimed
      once, worked in parallel waves, coordinated between passes. Review the combined result
      for cross-item integration issues, consistency problems, and any gaps that only become
      visible once everything is combined.

      ## Board (final state)
      {{.board}}

      {{range .worker_results}}## Item {{.Index}} -- {{.Status}}
      {{.Output}}

      {{end -}}
      Use your tools to read the actual codebase and verify integration across items, not just
      what each item's own summary claims. Pay particular attention to any item output above
      marked "INCOMPLETE", any item whose board status is not done, and findings that were
      posted but may not have been consumed — exactly the kinds of gaps this stage exists to
      catch.

      If everything integrates cleanly and no further changes are needed, respond with
      "NO_ISSUES" on its own line and nothing else. Otherwise, describe the integration issues
      found — these will be handed to a single implementer for a final fix pass.

  - id: final_implementation
    kind: agent_turn
    role: implementer
    run_unless_marker_in: final_findings
    run_unless_contains: "NO_ISSUES"
    prompt: |
      You are the implementer doing a final integration pass. The final evaluator found these
      cross-item issues after the board was fully worked:

      {{.final_findings}}

      ## Board (final state)
      {{.board}}

      Use your tools to read the codebase, fix the issues described, and write a plain-text
      summary of what you changed.
